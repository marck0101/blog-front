# CI-01: todo push e PR roda testes e build. PR vermelho = não fazer merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # mesma da Vercel
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Lint zerado em 03/11/2026: erro ou aviso novo barra o PR
      - run: npm run lint -- --max-warnings 0
      # "critical" e não "high": 4 alertas altos aceitos do gRPC dentro do Firestore,
      # que não entra no build (ver commit da SEC-06). Voltar para high quando sumirem.
      - run: npm audit --omit=dev --audit-level=critical
