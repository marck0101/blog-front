<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2563eb" />
    <!-- Endereço que não existe (vercel.json só manda para o app as rotas reais).
         A Vercel serve este arquivo com status 404 de verdade. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página não encontrada | Marcos Henrique Corrêa</title>
    <style>
      :root { --bg: #ffffff; --text: #111827; --muted: #6b7280; --accent: #2563eb; }
      html.dark { --bg: #0b0f19; --text: #f3f4f6; --muted: #9ca3af; --accent: #60a5fa; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 480px; text-align: center; }
      .code { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); }
      h1 { font-size: 28px; line-height: 1.25; margin: 8px 0 12px; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
      nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a { color: var(--accent); font-weight: 600; text-decoration: none; padding: 10px 16px; border-radius: 8px; border: 1px solid currentColor; }
      a.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <div class="code">ERRO 404</div>
      <h1>Esta página não existe</h1>
      <p>O endereço pode ter sido digitado errado ou o conteúdo mudou de lugar. Os artigos estão todos no blog.</p>
      <nav>
        <a class="primary" href="/blog">Ir para o blog</a>
        <a href="/seasons">Ver as seasons</a>
      </nav>
    </main>
  </body>
</html>
